<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fief</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #124a6d; }
  canvas { position: fixed; left: 0; top: 0; display: block; }
  #fog { width: 100vw; height: 100vh; pointer-events: none; }
  #static, #dynamic, #veil, #sky, #lights { pointer-events: none; }
  /* calques du ciel (voir js/sky.js) : cachés tant qu'ils n'ont rien à montrer */
  #veil, #sky, #lights { display: none; }
  #veil, #sky { transform-origin: 0 0; will-change: transform; }
  #sky { mix-blend-mode: multiply; z-index: 2; }
  #veil { z-index: 1; }
  #lights { z-index: 4; }
  #desk { z-index: 5; }
  #desk { position: fixed; inset: 0; }
</style>
</head>
<body>
<canvas id="ground"></canvas>
<canvas id="static"></canvas>
<canvas id="dynamic"></canvas>
<canvas id="fog"></canvas>
<canvas id="veil"></canvas>
<canvas id="sky"></canvas>
<canvas id="lights"></canvas>
<div id="desk"></div>
<script>
  // mise au point : ?rand=7 rend le hasard reproductible d'un lancement à l'autre
  (function () {
    var m = /[?&]rand=(\d+)/.exec(location.search);
    if (!m) return;
    var a = +m[1] >>> 0;
    Math.random = function () { a = (a + 0x6d2b79f5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  })();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
